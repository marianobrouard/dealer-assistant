[project]
name = "dealer-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "langchain>=1.4.8",
    "langchain-core>=1.7.4",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.19",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealer_assistant"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
